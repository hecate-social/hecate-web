name: Release (Codeberg)

# Tag-only. Per-arch matrix builds Tauri app bundles + portable
# tarballs on GitHub-hosted runners (only place we can build macOS).
# Final job creates a Codeberg Release and uploads all assets.
#
# tauri-action is intentionally invoked WITHOUT `tagName`/`releaseName`
# so it skips GitHub Release publication. We retire the GH Releases
# path entirely.
#
# Open follow-up: the Tauri app-updater (tauri.conf.json `updater`
# section) still points at GitHub Release URLs. That's separate from
# artifact distribution and tracked elsewhere.

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            target: darwin-amd64
            rust_target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app (no GH release publication)
        uses: tauri-apps/tauri-action@v0
        env:
          # Updater signing — keep working so app updates can later
          # be served from Codeberg-hosted update.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # Intentionally NO tagName/releaseName — tauri-action skips
          # GH Release creation when those are absent. Bundles land
          # in src-tauri/target/<rust_target>/release/bundle/.
          args: --target ${{ matrix.rust_target }}

      - name: Package portable binary
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.rust_target }}/release
          tar -czf "hecate-web-${{ matrix.target }}.tar.gz" hecate-web
          echo "PORTABLE_ARCHIVE=$(pwd)/hecate-web-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      - name: Stage all artifacts for upload
        shell: bash
        run: |
          mkdir -p /tmp/release-assets
          cp "$PORTABLE_ARCHIVE" /tmp/release-assets/
          # Tauri bundles (per platform) — copy what exists, ignore what
          # doesn't (e.g. .dmg only on macOS, .deb only on Linux).
          BUNDLE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          for ext in deb appimage rpm dmg msi exe; do
              find "$BUNDLE_DIR" -type f -iname "*.${ext}" -exec cp {} /tmp/release-assets/ \; 2>/dev/null || true
          done
          ls -la /tmp/release-assets/

      - name: Upload artifacts (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: /tmp/release-assets/
          if-no-files-found: error

  publish-codeberg-release:
    name: Publish to Codeberg Releases
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-assets-merged
          pattern: release-*
          merge-multiple: true

      - name: List collected assets
        run: ls -la /tmp/release-assets-merged/

      - name: Create Codeberg Release + upload assets
        env:
          CB_USER: ${{ secrets.CODEBERG_PUBLISHER_USER }}
          CB_TOKEN: ${{ secrets.CODEBERG_PACKAGE_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: hecate-social/hecate-web
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          ## Hecate Desktop ${TAG}

          Thin native desktop wrapper for the hecate-daemon. All UI is served by the daemon over Unix socket.

          ### Installation

          \`\`\`bash
          curl -fsSL https://codeberg.org/hecate-social/hecate-install/raw/branch/main/install.sh | bash
          \`\`\`

          ### Manual

          - **Linux**: \`.deb\`, \`.AppImage\`, or \`.tar.gz\` portable below
          - **macOS**: \`.dmg\` or \`.tar.gz\` portable below

          ### Requirements

          - [hecate-daemon](https://codeberg.org/hecate-social/hecate-daemon) running locally
          EOF
          )

          # Create the release. Idempotent-ish: if it already exists we
          # 422; we then look it up by tag.
          CREATE=$(curl -sS -o /tmp/release.json -w "%{http_code}" \
              -H "Authorization: token ${CB_TOKEN}" \
              -H "Content-Type: application/json" \
              -X POST "https://codeberg.org/api/v1/repos/${REPO}/releases" \
              -d "$(jq -n --arg tag "$TAG" --arg name "Hecate $TAG" --arg body "$BODY" \
                  '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')")
          if [ "$CREATE" = "201" ]; then
              REL_ID=$(jq -r .id < /tmp/release.json)
              echo "Created Codeberg release id=$REL_ID"
          else
              echo "Create returned $CREATE; looking up existing release by tag..."
              curl -sS -H "Authorization: token ${CB_TOKEN}" \
                  "https://codeberg.org/api/v1/repos/${REPO}/releases/tags/${TAG}" \
                  > /tmp/release.json
              REL_ID=$(jq -r .id < /tmp/release.json)
              echo "Existing release id=$REL_ID"
          fi

          # Upload each asset.
          for f in /tmp/release-assets-merged/*; do
              name=$(basename "$f")
              echo "Uploading $name..."
              curl -sS -o /dev/null -w "  %{http_code}\n" \
                  -H "Authorization: token ${CB_TOKEN}" \
                  -X POST "https://codeberg.org/api/v1/repos/${REPO}/releases/${REL_ID}/assets?name=${name}" \
                  -F "attachment=@${f}"
          done

          echo "Codeberg release: https://codeberg.org/${REPO}/releases/tag/${TAG}"

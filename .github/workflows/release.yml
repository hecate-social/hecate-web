name: Release (GitHub)

# Tag-only. Per-arch matrix builds Tauri app bundles + portable
# tarballs on GitHub-hosted runners (only place we can build macOS).
# tauri-action creates the GitHub Release itself and uploads the
# bundles plus the updater's `latest.json`; the final job appends the
# portable tarballs to that same release. The Tauri app-updater
# (tauri.conf.json `updater` section) reads `latest.json` from the
# release's `latest/download` URL.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-amd64
            rust_target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: linux-arm64
            rust_target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: darwin-arm64
            rust_target: aarch64-apple-darwin
          - os: macos-latest
            target: darwin-amd64
            rust_target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        run: npm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Build Tauri app + publish bundles to the GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing: tauri-action signs each bundle and emits
          # latest.json for the app-updater alongside it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Hecate ${{ github.ref_name }}"
          releaseBody: |
            Thin native desktop wrapper for the hecate-daemon. All UI is served by the daemon over Unix socket.

            Install everything with `curl -fsSL https://raw.githubusercontent.com/hecate-social/hecate-install/main/install.sh | bash`,
            or pick a bundle below (`.deb`/`.AppImage`/`.tar.gz` on Linux, `.dmg`/`.tar.gz` on macOS).
            Requires [hecate-daemon](https://github.com/hecate-social/hecate-daemon) running locally.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.rust_target }}

      - name: Package portable binary
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.rust_target }}/release
          tar -czf "hecate-web-${{ matrix.target }}.tar.gz" hecate-web
          echo "PORTABLE_ARCHIVE=$(pwd)/hecate-web-${{ matrix.target }}.tar.gz" >> "$GITHUB_ENV"

      - name: Stage all artifacts for upload
        shell: bash
        run: |
          mkdir -p /tmp/release-assets
          cp "$PORTABLE_ARCHIVE" /tmp/release-assets/
          # Tauri bundles (per platform) — copy what exists, ignore what
          # doesn't (e.g. .dmg only on macOS, .deb only on Linux).
          BUNDLE_DIR="src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          for ext in deb appimage rpm dmg msi exe; do
              find "$BUNDLE_DIR" -type f -iname "*.${ext}" -exec cp {} /tmp/release-assets/ \; 2>/dev/null || true
          done
          ls -la /tmp/release-assets/

      - name: Upload artifacts (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: /tmp/release-assets/
          if-no-files-found: error

  publish-portable-tarballs:
    name: Append portable tarballs to the GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/release-assets-merged
          pattern: release-*
          merge-multiple: true

      - name: List collected assets
        run: ls -la /tmp/release-assets-merged/

      - name: Upload to the release tauri-action created
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: /tmp/release-assets-merged/hecate-web-*.tar.gz

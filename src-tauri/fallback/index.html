<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hecate</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    -webkit-app-region: drag;
  }
  .container {
    text-align: center;
    -webkit-app-region: no-drag;
  }
  .sigil { font-size: 2.5rem; margin-bottom: 1rem; }
  h1 { font-size: 1.4rem; color: #c084fc; margin-bottom: 0.5rem; }
  p { font-size: 0.9rem; color: #888; margin-bottom: 1.5rem; }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid #333;
    border-top-color: #c084fc;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .retry {
    margin-top: 1.5rem;
    padding: 0.4rem 1.2rem;
    background: #2d2d4e;
    border: 1px solid #444;
    border-radius: 4px;
    color: #c084fc;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .retry:hover { background: #3d3d5e; }
</style>
</head>
<body>
<div class="container">
  <div class="sigil">&#x1F525;&#x1F5DD;&#xFE0F;&#x1F525;</div>
  <h1>Hecate</h1>
  <p>Connecting to daemon&hellip;</p>
  <div class="spinner"></div>
  <button class="retry" onclick="window.location.href='hecate://localhost'">Retry</button>
</div>
<script>
  // Auto-retry connecting to the daemon every 3 seconds
  const interval = setInterval(() => {
    fetch('hecate://localhost/api/health')
      .then(r => { if (r.ok) { clearInterval(interval); window.location.href = 'hecate://localhost'; } })
      .catch(() => {});
  }, 3000);
</script>
</body>
</html>
